name: Deploy Frontend (Cloudflare Pages)

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy-pages:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare Credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice ::Chua cau hinh CLOUDFLARE_API_TOKEN trong GitHub Secrets. Bo qua buoc deploy Cloudflare Pages."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        if: steps.check-creds.outputs.has_creds == 'true'
        run: npm install

      - name: Build Web Application
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm run build --workspace=@netcheck/shared
          npm run build --workspace=@netcheck/web

      - name: Deploy to Cloudflare Pages
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=netcheck-gaming --branch=main
