name: Deploy Backend API (Cloudflare Workers)

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare Credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice ::Chua cau hinh CLOUDFLARE_API_TOKEN trong GitHub Secrets. Bo qua buoc deploy Cloudflare Workers."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        if: steps.check-creds.outputs.has_creds == 'true'
        run: npm install

      - name: Build Shared Package
        if: steps.check-creds.outputs.has_creds == 'true'
        run: npm run build --workspace=@netcheck/shared

      - name: Deploy to Cloudflare Workers
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/api'
          command: deploy
