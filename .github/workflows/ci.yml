name: CI - Test & Typecheck

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Shared Package
        run: npm run build --workspace=@netcheck/shared

      - name: Run Unit Tests (All Workspaces)
        run: npm test

      - name: Build All Workspaces
        run: npm run build
